name: Sync to optimizely/ocp-skills

on:
  push:
    branches: [main]

concurrency:
  group: sync-to-optimizely
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run on the source repo — never on the synced copy.
    if: github.repository == 'ZaiusInc/ocp-skills'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a github.com auth header — it would
          # override the app token in the push URL and auth as the (ZaiusInc-only)
          # GITHUB_TOKEN, causing 404 on optimizely/ocp-skills.
          persist-credentials: false

      - name: Mint installation token for optimizely/ocp-skills
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: optimizely
          repositories: ocp-skills

      - name: Push to optimizely/ocp-skills
        env:
          SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/optimizely/ocp-skills.git" \
            HEAD:refs/heads/main
